function chooseStarter(id){const c=creatures.find(x=>x.id===id);if(!c)return;state.starter=id;state.activeCreature=id;if(!state.caught.includes(id))state.caught.push(id);creatureProgressFor(id);const form=creatureForm(c);state.hp=form.hp;state.maxHp=form.hp;save();closeModal();render();toast(c.name+' is now your active creature!')}
function header(){return `<div class="topbar"><div class="brand"><div class="brand-mark">${icon()}</div><div><h1>TechQuest</h1><small>IT Adventure</small></div></div><div class="stats"><div class="pill">LV <strong>${state.level}</strong></div><div class="pill">XP <strong>${state.xp}/${xpNeed()}</strong></div><div class="pill gold">Gold <strong>${state.gold}</strong></div><div class="pill">HP <strong>${state.hp}/${state.maxHp}</strong></div></div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="shell">${header()}<section class="hero"><div class="hero-copy"><span class="tag">Technical support RPG · cross-device edition</span><h2>Learn IT. Battle problems. Catch creatures.</h2><p>Explore technical domains, answer a fresh support question for every attack, weaken IT creatures, and capture them for your collection.</p><div style="height:14px"></div><div class="actions"><button class="btn primary" onclick="findCreature()">Find a Creature</button><button class="btn" onclick="openCollection()">View Collection</button><button class="btn" onclick="openStarterChoice()">Change Starter</button></div></div><div class="hero-art"><img src="assets/techquest-creature-showcase.png" alt="TechQuest creature and battle interface art showcase"><div class="art-badge">Upgraded creature art · responsive UI</div></div></section><div class="grid"><section class="card"><h3>Explore zones</h3><p class="sub">New zones unlock as you level. Pick a zone to search for a creature.</p><div class="zones">${zones.map(z=>`<button class="zone ${state.level<z.level?'locked':''}" ${state.level<z.level?'disabled':''} onclick="startZone(${z.id})"><span class="level">LV ${z.level}</span><b>${z.name}</b><span>${z.desc}</span></button>`).join('')}</div><div style="height:10px"></div><button class="btn primary wide" onclick="findCreature()">Find a Creature</button></section><section class="card"><h3>Command center</h3><div class="actions"><button class="btn" onclick="openCollection()">Creature Collection</button><button class="btn" onclick="openShop()">Tech Shop</button><button class="btn" onclick="openInventory()">Inventory</button><button class="btn warn" onclick="repairSelf()">Use Repair Kit</button><button class="btn" onclick="save();toast('Progress saved.')">Save Progress</button><button class="btn danger" onclick="resetGame()">Reset Save</button></div><div style="height:12px"></div><div class="sub">Current zone: <b style="color:#dce6ff">${zones.find(z=>z.id===state.zone)?.name||'Unknown'}</b><br>Captured: <b style="color:#dce6ff">${state.caught.length}/${creatures.length}</b> · <b style="color:#dce6ff">35 creatures/zone</b> · Battles won: <b style="color:#dce6ff">${state.wins}</b></div></section></div><section class="card" style="margin-top:14px"><h3>How combat works</h3><p class="sub">Every turn works like a monster battle: choose 1 of 4 attacks, then answer a brand-new IT question to execute it. Creature types have strengths and weaknesses, so choosing the right active creature matters. Base creatures and starters are single-type; the final evolution gains a second type. Each evolution has its own higher stat spread. Correct answers deal move-based damage; wrong answers let the creature hit back. Once the creature is below 55% HP, use a Capture Device to try to catch it.</p></section><section class="card" style="margin-top:14px"><h3>Creature system</h3><p class="sub"><b>175 total creatures</b> · 35 unique creatures in each zone. Common, Uncommon, Rare, and Epic creatures each have two evolutions at specific levels; Legendary and Mythical creatures remain single-stage. Every zone uses Common, Uncommon, Rare, <b style="color:#ffb86b">Epic</b>, Legendary, and Mythical rarities. Base forms and starters are single-type; every final evolution is dual-type. Each form has its own varied HP, ATK, DEF, SPATK, SPDEF, and SPD stats. Legendary and Mythical base stats are above every Epic final form. The game now has 12 technology-themed types.</p><div class="actions"><button class="btn" onclick="openTypeChart()">Type Advantages</button><button class="btn" onclick="openRarityChart()">Rarity Distribution</button></div></section><div class="footer-note">Built as a static web app: works on phones, tablets, laptops, and desktop browsers. <span class="kbd">Esc</span> closes dialogs.</div></div>`}
function startZone(id){if(state.level<id){toast('Reach level '+id+' to unlock this zone.');return}state.zone=id;save();render();toast('Entered '+zones.find(z=>z.id===id).name+'.')}
function difficultyForAttack(){const a=state.battle?.attack||0;return a<2?'Easy':a<4?'Medium':a<6?'Hard':'Expert'}
function pickQuestion(){const pool=questions[state.zone]||questions[1];const diff=difficultyForAttack();if(!state.battle.qDeck||state.battle.qDeck.length===0){state.battle.qDeck=pool.map((q,i)=>q[4]===diff?i:null).filter(i=>i!==null).sort(()=>Math.random()-.5)}const idx=state.battle.qDeck.shift();return pool[idx]}
function findCreature(){if(!state.starter){openStarterChoice();return}const pool=creatures.filter(c=>c.zone===state.zone);const c=pool[Math.floor(Math.random()*pool.length)];const p=creatures.find(x=>x.id===state.activeCreature)||starterCreature();state.encounters++;state.battle={creatureId:c.id,hp:c.hp,maxHp:c.hp,q:null,qDeck:[],attack:0,answered:false,selectedMove:null,feedback:'Choose one of your four attacks.',feedbackType:''};nextQuestion();openModal(renderBattle());}
function nextQuestion(){state.battle.q=pickQuestion();state.battle.answered=false}
function currentCreature(){return creatures.find(c=>c.id===state.battle?.creatureId)}
function currentPlayerCreature(){const base=creatures.find(c=>c.id===state.activeCreature)||starterCreature();return creatureForm(base)}
function selectMove(i){if(!state.battle||state.battle.answered)return;state.battle.selectedMove=i;state.battle.feedback='Now answer the IT question to execute '+movesFor(currentPlayerCreature())[i][0]+'.';state.battle.feedbackType='';openModal(renderBattle())}
function renderBattle(){const c=currentCreature(),p=currentPlayerCreature(),q=state.battle.q;const pct=Math.max(0,state.battle.hp/state.battle.maxHp*100);const pp=Math.max(0,state.hp/state.maxHp*100);const moves=movesFor(p);const z=zones.find(x=>x.id===state.zone)||zones[0];const sceneClass='zone-'+z.id;return `<div class="modal-head"><h2>${esc(c.name)} encountered</h2><button class="x" onclick="closeModal();save();render()">×</button></div><div class="battle-wrap"><div class="battle-stage-shell"><div class="creature-stage battle-scene ${sceneClass}"><div class="scene-grid"></div><div class="scene-top"><span class="scene-pill"><b>${esc(z.name)}</b> · Battle Zone</span><span class="scene-pill">Turn <b>${state.battle.attack+1}</b></span></div><div class="enemy-card"><div class="labelrow"><span><b>${esc(c.name)}</b> · ${esc(c.rarity)}</span><b>${Math.max(0,state.battle.hp)}/${c.hp}</b></div><div class="sub">${esc(typeLabel(c))} · Power ${c.power}</div><div class="bar enemy"><i style="width:${pct}%"></i></div></div><div class="battle-creature-wrap"><div class="creature-art">${creatureSVG(c)}</div></div><div class="player-card"><div class="labelrow"><span><b>${esc(p.name)}</b> · ${esc(p.rarity)}</span><b>${state.hp}/${state.maxHp}</b></div><div class="sub">${esc(typeLabel(p))} · SPD ${p.stats?.SPD??'—'}</div><div class="bar player"><i style="width:${pp}%"></i></div></div><div class="scene-hud"><span class="scene-pill">${esc(z.desc)}</span></div></div></div><div class="battle-panel"><div class="battle-zone-banner"><div><h3>${esc(z.name)}</h3><div class="sub">Choose your move, then prove your IT knowledge.</div></div><span class="type-badge">${esc(typeLabel(p))} vs ${esc(typeLabel(c))}</span></div><div class="qbox"><div class="qmeta"><span>Choose an attack · Turn ${state.battle.attack+1}</span><span class="difficulty ${q[4].toLowerCase()}">${q[4]}</span></div><div class="move-grid">${moves.map((m,i)=>`<button class="move-btn" ${state.battle.answered?'disabled':''} onclick="selectMove(${i})"><b>${i+1}. ${esc(m[0])}</b><span>Power ${m[1]} · ${esc(m[2])}</span></button>`).join('')}</div><div class="combat-status">${state.battle.selectedMove===null?'Pick 1 of 4 attacks before answering.':'Selected: '+esc(moves[state.battle.selectedMove][0])}<br>Type matchup: <b>${esc(typeLabel(p))}</b> vs <b>${esc(typeLabel(c))}</b> · <span>${typeMessage(p.battleTypes||p.battleType,c.battleTypes||c.battleType)}</span>${statRows(p)}</div><div class="question" style="margin-top:12px">${esc(q[0])}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" ${state.battle.answered||state.battle.selectedMove===null?'disabled':''} onclick="answerQuestion(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div><div class="feedback ${state.battle.feedbackType}">${esc(state.battle.feedback)}</div></div><div class="battle-actions"><button class="btn good" onclick="captureCreature()" ${state.battle.hp>state.battle.maxHp*.55||state.capture<=0?'disabled':''}>Capture (${state.capture})</button><button class="btn warn" onclick="repairSelf()" ${state.repair<=0||state.hp>=state.maxHp?'disabled':''}>Repair (${state.repair})</button><button class="btn danger" onclick="runBattle()">Run</button></div><div class="battle-note">The battlefield changes with every zone. Choose a move, answer a fresh IT question, and let the selected attack resolve.</div></div></div>`}

function answerQuestion(i){if(!state.battle||state.battle.answered||state.battle.selectedMove===null)return;state.battle.answered=true;const c=currentCreature(),p=currentPlayerCreature(),q=state.battle.q,m=movesFor(p)[state.battle.selectedMove];if(i===q[2]){const matchup=typeModifier(p.battleTypes||p.battleType,c.battleTypes||c.battleType);const dmg=Math.max(1,Math.round(((1+state.weaponPower)*m[1]+p.stats.ATK*.045+p.stats.SPATK*.035)*matchup));state.battle.hp-=dmg;gainXP(10+c.zone);gainCreatureXP(20+c.zone*2);state.gold+=4;state.battle.attack++;state.battle.feedback=`Correct! ${m[0]} dealt ${dmg} damage. ${typeMessage(p.battleTypes||p.battleType,c.battleTypes||c.battleType)} Choose another attack for the next turn.`;state.battle.feedbackType='good';if(state.battle.hp<=0){state.wins++;gainCreatureXP(30+c.zone*3);gainXP(20+c.zone*4);state.gold+=12+c.zone*2;state.hp=Math.min(state.maxHp,state.hp+Math.ceil(state.maxHp*.08));toast(c.name+' defeated!');save();openModal(`<div class="modal-head"><h2>Victory</h2><button class="x" onclick="closeModal();render()">×</button></div><div class="qbox"><div style="font-size:18px;font-weight:850">${esc(c.name)} was defeated.</div><p class="sub">You earned XP and gold. Your active creature remains ${esc(p.name)}.</p><button class="btn primary wide" onclick="closeModal();render();findCreature()">Find another creature</button></div>`);return}nextQuestion();state.battle.selectedMove=null}else{gainCreatureXP(8);state.hp-=Math.max(1,Math.round(c.stats.ATK*.45+c.stats.SPATK*.2));state.battle.feedback=`Incorrect. ${esc(q[3])} ${esc(p.name)} failed to execute the attack and took ${c.power} damage. Choose a new attack and answer a new question.`;state.battle.feedbackType='bad';if(state.hp<=0){state.hp=Math.max(1,Math.ceil(state.maxHp*.35));state.gold=Math.max(0,state.gold-10);toast('Your creature retreated to safety.');save();openModal(`<div class="modal-head"><h2>Retreat</h2><button class="x" onclick="closeModal();render()">×</button></div><div class="qbox"><div style="font-size:18px;font-weight:850">The creature forced you to retreat.</div><p class="sub">Your active creature recovered at the nearest support station.</p><button class="btn primary wide" onclick="closeModal();render()">Return to base</button></div>`);return}nextQuestion();state.battle.selectedMove=null}openModal(renderBattle());}
function captureCreature(){const c=currentCreature();if(state.capture<=0||state.battle.hp>state.battle.maxHp*.55)return;state.capture--;const weakness=1-state.battle.hp/state.battle.maxHp;const chance=Math.min(.92,.35+weakness*.8+(c.rarity==='Common'?.08:c.rarity==='Uncommon'?.03:0));if(Math.random()<chance){if(!state.caught.includes(c.id))state.caught.push(c.id);state.gold+=10+c.zone*2;gainXP(18+c.zone*2);toast(c.name+' captured!');save();openModal(`<div class="modal-head"><h2>Captured</h2><button class="x" onclick="closeModal();render()">×</button></div><div class="qbox"><div style="display:grid;place-items:center">${creatureSVG(c)}</div><div style="text-align:center;font-size:19px;font-weight:850">${esc(c.name)} joined your collection.</div><p class="sub" style="text-align:center">${esc(c.desc)}</p><button class="btn primary wide" onclick="closeModal();render()">Continue</button></div>`)}else{state.battle.feedback='The creature broke free. Weaken it further or try again with another Capture Device.';state.battle.feedbackType='bad';save();openModal(renderBattle())}}
function repairSelf(){if(state.repair<=0||state.hp>=state.maxHp){toast('No repair needed.');return}state.repair--;const heal=Math.ceil(state.maxHp*.35);state.hp=Math.min(state.maxHp,state.hp+heal);toast('Repair Kit restored '+heal+' HP.');if(state.battle)openModal(renderBattle());else{save();render()}}
function runBattle(){state.battle=null;save();closeModal();render();toast('You escaped safely.')}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openCollection(){const caught=creatures.filter(c=>state.caught.includes(c.id));openModal(`<div class="modal-head"><h2>Creature Collection</h2><button class="x" onclick="closeModal()">×</button></div><p class="sub">${caught.length}/${creatures.length} captured. Common through Epic creatures evolve twice; Legendary and Mythical creatures do not evolve.</p><div class="creature-grid">${creatures.map(c=>{const owned=state.caught.includes(c.id);const form=owned?creatureForm(c):c;return `<div class="creature-card ${owned?'caught':''}"><div class="art ${owned?'':'unknown'}">${creatureSVG(form)}</div><b>${owned?esc(form.name):'Unknown Creature'}</b><div class="rarity ${owned?c.rarity.toLowerCase():''}">${owned?esc(c.rarity)+' · '+esc(typeLabel(form)):'???'}</div>${owned?statRows(form)+evolutionLabel(c):''}</div>`}).join('')}</div>`) }
function openShop(){openModal(`<div class="modal-head"><h2>Tech Shop</h2><button class="x" onclick="closeModal()">×</button></div><p class="sub">Upgrade your toolkit to increase damage dealt by correct answers.</p><div class="shop-grid">${gear.slice(1).map(g=>`<div class="item"><b>${g.name}</b><p>Damage per correct answer: <strong>+${g.power}</strong>. Current: +${state.weaponPower}.</p><div class="price">${g.cost} gold</div><div style="height:8px"></div><button class="btn primary wide" onclick="buyGear('${g.id}')" ${state.gold<g.cost?'disabled':''}>Buy</button></div>`).join('')}<div class="item"><b>Repair Kit</b><p>Restores 35% of your maximum HP.</p><div class="price">25 gold</div><div style="height:8px"></div><button class="btn warn wide" onclick="buyItem('repair')" ${state.gold<25?'disabled':''}>Buy</button></div><div class="item"><b>Capture Device</b><p>Used to attempt creature captures after weakening them.</p><div class="price">20 gold</div><div style="height:8px"></div><button class="btn good wide" onclick="buyItem('capture')" ${state.gold<20?'disabled':''}>Buy</button></div></div>`)}
function buyGear(id){const g=gear.find(x=>x.id===id);if(!g||state.gold<g.cost)return;state.gold-=g.cost;state.weapon=id;state.weaponPower=g.power;save();toast(g.name+' equipped.');openShop()}
function buyItem(kind){const cost=kind==='repair'?25:20;if(state.gold<cost)return;state.gold-=cost;state[kind]++;save();toast(kind==='repair'?'Repair Kit purchased.':'Capture Device purchased.');openShop()}
function openInventory(){const g=gear.find(x=>x.id===state.weapon);openModal(`<div class="modal-head"><h2>Inventory</h2><button class="x" onclick="closeModal()">×</button></div><div class="inv-grid"><div class="item"><b>Equipped Toolkit</b><p>${esc(g.name)}</p><strong>Damage: +${state.weaponPower}</strong></div><div class="item"><b>Repair Kits</b><p>Emergency field repairs.</p><strong>${state.repair}</strong></div><div class="item"><b>Capture Devices</b><p>Used on weakened creatures.</p><strong>${state.capture}</strong></div><div class="item"><b>Collection</b><p>Unique creatures captured.</p><strong>${state.caught.length}/${creatures.length}</strong></div></div>`)}
function openTypeChart(){openModal(`<div class="modal-head"><h2>Type Advantages</h2><button class="x" onclick="closeModal()">×</button></div><p class="sub">Use type matchups to increase or reduce damage. Base forms are single-type; final evolutions are dual-type.</p><div class="qbox" style="margin-bottom:10px"><b>12 Types:</b> Hardware · Network · Software · Security · Cloud · Data · Database · AI · Systems · Virtualization · IoT · Support</div><div class="creature-grid">${Object.entries(battleTypes).map(([t,v])=>`<div class="item"><b>${t}</b><p><strong>Strong vs:</strong> ${v.strong.join(', ')}</p><p><strong>Weak vs:</strong> ${v.weak.join(', ')}</p></div>`).join('')}</div><div class="qbox" style="margin-top:10px"><b>Super effective: ×1.35</b><br><span class="sub">Not very effective: ×0.72 · Neutral: ×1.0</span></div>`)}
function openRarityChart(){const counts={};creatures.forEach(c=>counts[c.rarity]=(counts[c.rarity]||0)+1);openModal(`<div class="modal-head"><h2>Rarity Distribution</h2><button class="x" onclick="closeModal()">×</button></div><div class="creature-grid">${['Common','Uncommon','Rare','Epic','Legendary','Mythical'].map(r=>`<div class="item"><b class="rarity ${r.toLowerCase()}">${r}</b><p><strong>${counts[r]}</strong> total · ${counts[r]/5} per zone</p></div>`).join('')}</div><p class="sub">Each zone has 8 Common, 7 Uncommon, 6 Rare, 5 Epic, 5 Legendary, and 4 Mythical creatures.</p>`)}
function resetGame(){if(!confirm('Reset all TechQuest progress?'))return;localStorage.removeItem(SAVE_KEY);location.reload()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('beforeunload',save);validateCreatureTypes();render();if(!state.starter)setTimeout(openStarterChoice,120);
</script><script src="register-sw.js"></script>
</body>
</html>
